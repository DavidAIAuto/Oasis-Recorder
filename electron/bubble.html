<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src mediastream: blob:" />
<title>Recoder Camera</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* The whole bubble is a drag handle for moving the window. */
  .bubble {
    position: absolute; inset: 4px; border-radius: 50%; overflow: hidden;
    background: #18181b; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85);
    -webkit-app-region: drag; cursor: grab;
  }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 18%; color: #d4d4d8; font: 500 12px/1.4 -apple-system, system-ui, sans-serif;
  }
  .error .msg { display: flex; }
  .error video { display: none; }
</style>
</head>
<body>
<div class="bubble" id="bubble">
  <video id="v" autoplay muted playsinline></video>
  <div class="msg" id="msg"></div>
</div>
<script>
  (async () => {
    const deviceId = new URLSearchParams(location.search).get('deviceId');
    const fail = (text) => {
      document.getElementById('msg').textContent = text;
      document.getElementById('bubble').classList.add('error');
    };
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 30, max: 30 },
        },
      });
      document.getElementById('v').srcObject = stream;
      stream.getVideoTracks()[0]?.addEventListener('ended', () => fail('Camera disconnected'));
    } catch (e) {
      fail(e && e.name === 'NotAllowedError'
        ? 'Allow camera access in System Settings → Privacy & Security → Camera'
        : 'Camera unavailable');
    }
  })();
</script>
</body>
</html>
